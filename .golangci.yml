run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  skip-dirs:
    - vendor
    - .github

linters-settings:
  govet:
    enable-all: true
    check-shadowing: true
  gocyclo:
    min-complexity: 15
  gocognit:
    min-complexity: 20
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
  goimports:
    local-prefixes: github.com/xarf/xarf-go
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
  gosec:
    excludes:
      - G404 # Weak random number - acceptable for non-crypto use
  revive:
    rules:
      - name: exported
        disabled: false

linters:
  enable:
    # Enabled by default
    - errcheck    # Check for unchecked errors
    - gosimple    # Simplify code
    - govet       # Vet examines Go source code
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Advanced static analysis
    - typecheck   # Type checking
    - unused      # Find unused code

    # Additional quality linters
    - bodyclose   # Check HTTP body close
    - copyloopvar # Loop variable copying
    - dogsled     # Checks for too many blank identifiers
    - dupl        # Code duplication
    - gochecknoinits # Check for init functions
    - gocognit    # Cognitive complexity
    - goconst     # Find repeated strings that could be constants
    - gocritic    # Comprehensive linting
    - gocyclo     # Cyclomatic complexity
    - gofmt       # Format checking
    - goimports   # Check imports
    - goprintffuncname # Printf-like function names
    - gosec       # Security problems (like bandit for Python)
    - lll         # Line length
    - misspell    # Spelling errors
    - nakedret    # Naked returns
    - prealloc    # Preallocate slices
    - revive      # Fast, configurable linter
    - unconvert   # Unnecessary type conversions
    - unparam     # Unused function parameters
    - whitespace  # Whitespace issues

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - lll
        - gocognit
