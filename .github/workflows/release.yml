name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # CHANGELOG headers follow Keep a Changelog style without the "v" prefix
          # (e.g. "## [1.1.0]"), while tags are "v1.1.0" — strip the prefix to match.
          CHANGELOG_VERSION=${VERSION#v}

          # Print the lines between this version's header and the next "## [" header.
          awk -v ver="$CHANGELOG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for ${CHANGELOG_VERSION}; using auto-generated notes." \
              > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          # Append GitHub's auto-generated commit/PR notes so the release is never empty.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    name: Trigger pkg.go.dev indexing
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Warm the Go module proxy
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Requesting the version from the public proxy makes it fetch and cache
          # the module, which is what triggers pkg.go.dev to index it. This only
          # succeeds once the repository is public; it is best-effort otherwise.
          if curl -fsS "https://proxy.golang.org/github.com/xarf/xarf-go/@v/${VERSION}.info"; then
            echo "Proxy fetched ${VERSION}; pkg.go.dev will index it shortly."
          else
            echo "Proxy could not fetch ${VERSION} (expected while the repository is private)."
          fi
